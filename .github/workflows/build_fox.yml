name: Build OrangeFox Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 cpio aria2

      - name: Setup repo tool & git config
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "Vinodarin"
          git config --global user.email "vinodarin@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync OrangeFox Manifest (fox_14.1)
        run: |
          mkdir -p ~/fox_14.1
          cd ~/fox_14.1
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_14.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          git clone https://github.com/${{ github.repository }}.git ~/fox_14.1/device/xiaomi/songyuan

      - name: Build OrangeFox
        run: |
          cd ~/fox_14.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=songyuan
          export LC_ALL="C"
          source build/envsetup.sh
          lunch fox_songyuan-eng
          mka adbd bootimage

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ~/output
          cp ~/fox_14.1/out/target/product/songyuan/OrangeFox*.zip ~/output/ || true
          cp ~/fox_14.1/out/target/product/songyuan/OrangeFox*.img ~/output/ || true
          cp ~/fox_14.1/out/target/product/songyuan/boot.img ~/output/OrangeFox-R11.1-Unofficial-songyuan.img || true
          ls -lh ~/output

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OrangeFox Unofficial for Poco F9 Ultra (${{ github.run_number }})
          files: ~/output/*
